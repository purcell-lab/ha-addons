name: CitrineOS Isolated Lab
version: "0.8.0"
slug: citrineos_server
description: Pinned CitrineOS v2.1.0 laboratory server (built from source) with private dependencies, read-only access, opt-in open station admission and scoped OCPP 2.1/2.0.1/1.6 commands for simulators or, opt-in, one physical charger.
url: https://github.com/purcell-lab/ha-addons
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
ingress: false
host_network: false
hassio_api: false
homeassistant_api: false
docker_api: false
# Only the opt-in Plugfest listener (Security Profile 1, provisioned stations)
# can be published, and only when you set a host port on the Network tab.
ports:
  8083/tcp: null
  8100/tcp: null
  8101/tcp: null
  8102/tcp: null
  8103/tcp: null
  8104/tcp: null
  8105/tcp: null
ports_description:
  8083/tcp: Plugfest OCPP 2.1/2.0.1/1.6 listener (Basic Auth for provisioned stations, or no auth with plugfest_open_admission; off unless plugfest_enabled and a host port is set)
  8100/tcp: Plugfest listener for station 1 (same admission as 8083; off unless plugfest_enabled and a host port is set)
  8101/tcp: Plugfest listener for station 2 (same admission as 8083; off unless plugfest_enabled and a host port is set)
  8102/tcp: Plugfest listener for station 3 (same admission as 8083; off unless plugfest_enabled and a host port is set)
  8103/tcp: Plugfest listener for station 4 (same admission as 8083; off unless plugfest_enabled and a host port is set)
  8104/tcp: Plugfest listener for station 5 (same admission as 8083; off unless plugfest_enabled and a host port is set)
  8105/tcp: Plugfest listener for station 6 (same admission as 8083; off unless plugfest_enabled and a host port is set)
options:
  mode: disconnected
  database_host: ""
  database_password: ""
  broker_host: ""
  broker_password: ""
  hasura_host: ""
  hasura_secret: ""
  api_token: ""
  simulator_enabled: false
  simulator_password: ""
  profile_simulator_enabled: false
  profile_simulator_password: ""
  command_control_enabled: false
  command_token: ""
  open_admission_enabled: false
  command_station_id: SIM-EV-EVEREST-V2G-01
  command_real_stations_enabled: false
  device_model_reports: true
  plugfest_enabled: false
  plugfest_open_admission: false
  plugfest_stations: []
  operator_ui_enabled: false
  operator_token: ""
  operator_commands_enabled: false
  price_commands_enabled: false
  price_currency: AUD
schema:
  mode: list(disconnected|isolated)
  database_host: str
  database_password: password
  broker_host: str
  broker_password: password
  hasura_host: str
  hasura_secret: password
  api_token: password
  simulator_enabled: bool
  simulator_password: password
  profile_simulator_enabled: bool
  profile_simulator_password: password
  command_control_enabled: bool
  command_token: password
  open_admission_enabled: bool
  command_station_id: match(^[A-Za-z0-9._~*+-]{1,48}$)
  command_real_stations_enabled: bool
  device_model_reports: bool
  plugfest_enabled: bool
  plugfest_open_admission: bool
  operator_ui_enabled: bool
  operator_token: password
  operator_commands_enabled: bool
  price_commands_enabled: bool
  price_currency: match(^[A-Z]{3}$)
  plugfest_stations:
    - id: match(^[A-Za-z0-9._~*+-]{1,48}$)
      password: password
