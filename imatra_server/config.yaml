name: Imatra ISO 15118-2 Lab
version: "0.1.0"
slug: imatra_server
description: Imatra cloud ISO 15118-2 server (Apache-2.0, built from the pinned upstream source) with its own internal Postgres, Valkey and Mosquitto. Lab use with simulators; no OCPP yet.
url: https://github.com/purcell-lab/ha-addons
arch:
  - aarch64
  - amd64
startup: application
boot: manual
ingress: false
host_network: false
hassio_api: false
homeassistant_api: false
docker_api: false
map:
  - share:rw
# Nothing is published unless you set a host port on the Network tab.
# Other Apps reach the API on <repo>-imatra-server:8080 without publishing.
ports:
  8080/tcp: null
  8883/tcp: null
ports_description:
  8080/tcp: Operator API gateway over HTTP (/v1 and /health; X-API-Key required on /v1)
  8883/tcp: Device broker, MQTT with mutual TLS (device certificates from /share/imatra)
options:
  operator_api_key: ""
  broker_dns: ""
  broker_ips: []
  devices: []
  evse_max_current_a: 32
  evse_phases: 3
  evse_nominal_voltage_v: 230
schema:
  operator_api_key: password
  broker_dns: str?
  broker_ips:
    - str
  devices:
    - id: match(^[a-z0-9][a-z0-9-]{2,62}$)
      type: str?
      rules: str?
  evse_max_current_a: int(6,80)
  evse_phases: int(1,3)
  evse_nominal_voltage_v: int(200,250)
