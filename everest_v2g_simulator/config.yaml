name: EVerest DC V2G Test Charger
version: "0.1.10"
slug: everest_v2g_simulator
description: Isolated EVerest bidirectional DC charger and EV (ISO 15118-20 DC_BPT); OCPP 2.1 with 2.0.1 fallback.
url: https://github.com/purcell-lab/ha-addons
image: ghcr.io/purcell-lab/{arch}-everest-v2g-simulator
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
timeout: 30
ingress: true
ingress_port: 8099
panel_icon: mdi:car-electric
panel_title: EVerest V2G Charger
# Only to create a private veth pair and an inbound firewall inside this App's
# own network namespace (see DOCS.md, Security). No host networking.
privileged:
  - NET_ADMIN
# Only for the optional, outbound-only HA control bridge (option ha_control,
# default off): one status object and one command event type (DOCS.md).
homeassistant_api: true
options:
  csms_url: ""
  charge_point_id: SIM-EV-EVEREST-V2G-01
  ocpp_version: "2.1"
  max_power_kw: 25
  tx_sample_interval_s: 5
  acknowledge_test_isolation: false
  archive_and_rebind: false
  ha_control: false
  csms_basic_auth_password: ""
schema:
  csms_url: str
  charge_point_id: match(^SIM-EV-[A-Za-z0-9_-]{1,36}$)
  ocpp_version: list(2.1|2.0.1)
  max_power_kw: int(3,25)
  tx_sample_interval_s: int(1,60)
  acknowledge_test_isolation: bool
  archive_and_rebind: bool
  ha_control: bool
  csms_basic_auth_password: password
