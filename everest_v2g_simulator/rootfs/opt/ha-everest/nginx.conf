worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_max_body_size 1k;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    server {
        listen 8099;
        # Actual peer (HA Supervisor Ingress), not a client-controlled header.
        allow 172.30.32.2;
        deny all;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; frame-ancestors 'self'" always;
        location / {
            # Everything except the EV-simulator commands, the EV's charging
            # needs and the discovery self-test is read-only.
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
        }
        location ~ ^/api/(ev/(plugin|stop|unplug|needs)|diag/selftest)$ {
            limit_except POST { deny all; }
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
        }
    }
}
