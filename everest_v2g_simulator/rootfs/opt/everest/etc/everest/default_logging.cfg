# EVerest boost.log configuration for the Home Assistant App log (no colour
# codes). Boost filters run before the message text exists, so repetitive
# composite-schedule messages from the pinned demo patch are dropped by the
# App's log forwarder (app.py) instead.
[Core]
DisableLogging=false
Filter="%Severity% >= INFO"

[Sinks.Console]
Destination=Console
Format="%TimeStamp% [%Severity%] %Process%: %Message%"
Asynchronous=false
AutoFlush=true
