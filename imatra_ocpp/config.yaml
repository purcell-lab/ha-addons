name: Imatra OCPP Bridge
version: "0.1.5"
slug: imatra_ocpp
image: ghcr.io/purcell-lab/{arch}-imatra-ocpp
description: Puts OCPP in the Imatra control path. Each Imatra ISO 15118-2 device becomes an OCPP 2.1 / 2.0.1 charging station towards CitrineOS; charging profiles become confirmed Imatra current limits.
url: https://github.com/purcell-lab/imatra-ocpp
arch:
  - aarch64
  - amd64
startup: application
boot: manual
ingress: false
host_network: false
hassio_api: false
homeassistant_api: false
docker_api: false
# No ports: outbound only, to Imatra and the CSMS on the internal network.
options:
  csms_url: ""
  csms_password: ""
  imatra_url: ""
  imatra_api_key: ""
  devices: []
  station_id_prefix: "IMATRA-"
  confirm_timeout_s: 10
  default_duration_s: 3600
  voltage_v: 230
  phases: 3
schema:
  csms_url: match(^wss?://.+)
  csms_password: password?
  imatra_url: str?
  imatra_api_key: password
  devices:
    - match(^[a-z0-9][a-z0-9-]{2,62}$)
  station_id_prefix: match(^[A-Za-z0-9._-]{0,20}$)
  confirm_timeout_s: int(1,25)
  default_duration_s: int(60,86400)
  voltage_v: int(200,250)
  phases: int(1,3)
