name: EVerest OCPP 2.1 Test Charger
version: "0.1.3"
slug: everest_simulator
description: Isolated EVerest software-in-the-loop AC charger; OCPP 2.1 with 2.0.1 fallback.
url: https://github.com/purcell-lab/ha-addons
image: ghcr.io/purcell-lab/{arch}-everest-simulator
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
timeout: 30
ingress: true
ingress_port: 8099
panel_icon: mdi:ev-station
panel_title: EVerest Test Charger
options:
  csms_url: ""
  charge_point_id: SIM-EV-EVEREST-01
  ocpp_version: "2.1"
  phases: 1
  max_current_a: 32
  acknowledge_test_isolation: false
  archive_and_rebind: false
schema:
  csms_url: str
  charge_point_id: match(^SIM-EV-[A-Za-z0-9_-]{1,36}$)
  ocpp_version: list(2.1|2.0.1)
  phases: list(1|3)
  max_current_a: int(6,32)
  acknowledge_test_isolation: bool
  archive_and_rebind: bool
