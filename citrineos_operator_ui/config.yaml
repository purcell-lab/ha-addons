name: CitrineOS Operator UI
version: "0.2.0"
slug: citrineos_operator_ui
description: CitrineOS v2.1.0 Operator UI for the isolated lab, behind Home Assistant Ingress; read-only data, optional bounded commands.
url: https://github.com/purcell-lab/ha-addons/tree/main/citrineos_operator_ui
image: ghcr.io/purcell-lab/{arch}-citrineos-operator-ui
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:ev-station
panel_title: CitrineOS
hassio_api: false
homeassistant_api: false
docker_api: false
host_network: false
options:
  gateway_url: ""
  operator_token: ""
  commands_enabled: false
schema:
  gateway_url: str
  operator_token: password
  commands_enabled: bool
