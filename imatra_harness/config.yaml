name: Imatra Test Harness (internal use)
version: "0.1.2"
slug: imatra_harness
description: Imatra test station and ISO 15118-2 test EV (Josev) on a virtual link, as one simulated device against the Imatra ISO 15118-2 Lab App. Built on your Home Assistant; the harness is PolyForm Internal Use 1.0.0 and is fetched only after you accept its licence.
url: https://github.com/purcell-lab/ha-addons
arch:
  - aarch64
  - amd64
startup: application
boot: manual
ingress: false
host_network: false
hassio_api: false
homeassistant_api: false
docker_api: false
# NET_ADMIN only to create the virtual V2G link (a veth pair) inside this
# App's own network namespace. No host network, no ports.
privileged:
  - NET_ADMIN
map:
  - share:ro
# No image: key. The Supervisor builds this App locally; nothing is published.
options:
  accept_licence: false
  device_id: harness-01
  server_host: ""
  broker_name: ""
  replug_s: 30
  ev_pause_s: 20
  charge_loop_cycles: 30
  ev_protocol: ISO_15118_2
schema:
  accept_licence: bool
  device_id: match(^[a-z0-9][a-z0-9-]{2,62}$)
  server_host: str?
  broker_name: str?
  replug_s: int(0,3600)
  ev_pause_s: int(1,3600)
  charge_loop_cycles: int(1,100000)
  ev_protocol: list(ISO_15118_2|DIN_SPEC_70121)
