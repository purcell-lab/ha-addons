name: Open Dynamic Export App
on:
  pull_request:
    paths:
      - "open_dynamic_export/**"
      - ".github/workflows/ode.yml"
      - ".github/workflows/ode-publish.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ode-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python3 -m pip install PyYAML==6.0.2
      - run: python3 -m unittest discover -s open_dynamic_export/tests -p "test_*.py" -v
      - run: node --test open_dynamic_export/tests/run.test.mjs
      - run: sh -n open_dynamic_export/tests/ci_image_checks.sh
      - run: git diff --check
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build native image (no publication or deployment)
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' open_dynamic_export/config.yaml)
          docker build --build-arg BUILD_ARCH=${{ matrix.arch }} \
            --build-arg BUILD_VERSION="$version" -t ode:built open_dynamic_export
          docker image ls ode:built
      - name: Image checks (same as the publish gate)
        run: sh open_dynamic_export/tests/ci_image_checks.sh ode:built
  published-image:
    # Merge gate: config.yaml points HA at a prebuilt image, so the exact
    # version must already be publicly pullable (anonymous, both arches).
    # Publish it first with the approval-gated ode-publish.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prebuilt image for this version is public on GHCR
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' open_dynamic_export/config.yaml)
          image=$(sed -n 's/^image: //p' open_dynamic_export/config.yaml)
          test -n "$version" && test -n "$image"
          for arch in amd64 aarch64; do
            ref="$(echo "$image" | sed "s/{arch}/$arch/"):$version"
            if docker manifest inspect "$ref" > /dev/null; then
              echo "public: $ref"
            else
              echo "::error::$ref is not publicly pullable. Publish it (ode-publish.yml, version $version) and make the package public before merging."
              exit 1
            fi
          done
