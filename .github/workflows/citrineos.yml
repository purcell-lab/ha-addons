name: CitrineOS isolated stack
on:
  pull_request:
    paths:
      - "citrineos_*/**"
      - ".github/workflows/citrineos.yml"
      - ".github/workflows/citrineos-server-publish.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: citrineos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python3 -m pip install PyYAML==6.0.2
      - run: python3 -m unittest discover -s citrineos_server/tests -p test_packaging.py -v
      - run: python3 -m unittest discover -s citrineos_server/tests -p test_v2g_readiness.py -v
      - run: node --test citrineos_server/tests/*.test.mjs
      - run: python3 -m unittest discover -s citrineos_simulator/tests -v
      - run: sh -n citrineos_server/tests/ci_image_checks.sh
      - run: git diff --check
  upstream-patches:
    # The source patches apply to the pinned CitrineOS commit, the patched
    # source compiles, and upstream's own tests for the patched handlers and
    # endpoints pass.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
      - name: Fetch CitrineOS at the pinned commit and apply patches/
        run: |
          commit=$(python3 -c "import json;print(json.load(open('citrineos_server/compatibility-lock.json'))['server']['commit'])")
          git init -q /tmp/core
          git -C /tmp/core remote add origin https://github.com/citrineos/citrineos-core.git
          git -C /tmp/core fetch -q --depth 1 origin "$commit"
          git -C /tmp/core checkout -q FETCH_HEAD
          test "$(git -C /tmp/core rev-parse HEAD)" = "$commit"
          for patch in citrineos_server/patches/*.patch; do
            git -C /tmp/core apply --check "$PWD/$patch"
            git -C /tmp/core apply "$PWD/$patch"
          done
      - name: Build the patched server and run upstream's handler tests
        working-directory: /tmp/core
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter "@citrineos/ocpp-server..." build
          pnpm exec vitest run \
            packages/ocpp/test/handlers/requests/2/notify-report-and-charging-needs.test.ts \
            packages/ocpp/test/handlers/requests/2/authorize-request-ocpp-21-handler.test.ts \
            packages/ocpp/test/handlers/requests/2/der-control-ocpp-21-handlers.test.ts \
            packages/ocpp/test/handlers/requests/2/charging-limit-requests-ocpp-2-handlers.test.ts \
            packages/ocpp/test/handlers/requests/2/certificate-and-misc-requests.test.ts \
            packages/ocpp/test/apis/ocpp/smart-charging-endpoint-list.test.ts
  private-stack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned images without publication
        run: |
          for app in database broker hasura server simulator; do
            docker build --build-arg BUILD_ARCH=${{ matrix.arch }} \
              -t "citrine-${app}:test" "citrineos_${app}"
          done
      - name: Server image checks (same as the publish gate)
        run: sh citrineos_server/tests/ci_image_checks.sh citrine-server:test
      - name: Authentication, discovery, persistence and logical restore
        env:
          TEST_NATIVE_SIMULATOR: "1"
          TEST_PLUGFEST: "1"
          TEST_OPERATOR: "1"
          TEST_EMS: "1"
        run: python3 citrineos_server/tests/stack_smoke.py
  published-image:
    # Merge gate: config.yaml points HA at a prebuilt server image, so the
    # exact version must already be publicly pullable (anonymous, both
    # arches). Publish it first with the approval-gated
    # citrineos-server-publish.yml. PR CI above still builds and tests the
    # image from source.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prebuilt image for this version is public on GHCR
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' citrineos_server/config.yaml)
          image=$(sed -n 's/^image: //p' citrineos_server/config.yaml)
          test -n "$version" && test -n "$image"
          for arch in amd64 aarch64; do
            ref="$(echo "$image" | sed "s/{arch}/$arch/"):$version"
            if docker manifest inspect "$ref" > /dev/null; then
              echo "public: $ref"
            else
              echo "::error::$ref is not publicly pullable. Publish it (citrineos-server-publish.yml, version $version) and make the package public before merging."
              exit 1
            fi
          done
