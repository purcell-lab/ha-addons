name: CitrineOS isolated stack
on:
  pull_request:
    paths:
      - "citrineos_*/**"
      - ".github/workflows/citrineos.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: citrineos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python3 -m pip install PyYAML==6.0.2
      - run: python3 -m unittest discover -s citrineos_server/tests -p test_packaging.py -v
      - run: python3 -m unittest discover -s citrineos_server/tests -p test_v2g_readiness.py -v
      - run: node --test citrineos_server/tests/*.test.mjs
      - run: python3 -m unittest discover -s citrineos_simulator/tests -v
      - run: git diff --check
  upstream-patches:
    # The source patches apply to the pinned CitrineOS commit, the patched
    # source compiles, and upstream's own tests for both handlers pass.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
      - name: Fetch CitrineOS at the pinned commit and apply patches/
        run: |
          commit=$(python3 -c "import json;print(json.load(open('citrineos_server/compatibility-lock.json'))['server']['commit'])")
          git init -q /tmp/core
          git -C /tmp/core remote add origin https://github.com/citrineos/citrineos-core.git
          git -C /tmp/core fetch -q --depth 1 origin "$commit"
          git -C /tmp/core checkout -q FETCH_HEAD
          test "$(git -C /tmp/core rev-parse HEAD)" = "$commit"
          for patch in citrineos_server/patches/*.patch; do
            git -C /tmp/core apply --check "$PWD/$patch"
            git -C /tmp/core apply "$PWD/$patch"
          done
      - name: Build the patched server and run upstream's handler tests
        working-directory: /tmp/core
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter "@citrineos/ocpp-server..." build
          pnpm exec vitest run \
            packages/ocpp/test/handlers/requests/2/notify-report-and-charging-needs.test.ts \
            packages/ocpp/test/handlers/requests/2/authorize-request-ocpp-21-handler.test.ts
  private-stack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned images without publication
        run: |
          for app in database broker hasura server simulator; do
            docker build --build-arg BUILD_ARCH=${{ matrix.arch }} \
              -t "citrine-${app}:test" "citrineos_${app}"
          done
      - name: Upstream routes and permissions in the image (no /dev routes in jwt mode)
        run: |
          docker run --rm -v "$PWD/citrineos_server/tests:/probe:ro" --entrypoint node \
            citrine-server:test /probe/route-probe.mjs
      - name: Authentication, discovery, persistence and logical restore
        env:
          TEST_NATIVE_SIMULATOR: "1"
          TEST_PLUGFEST: "1"
          TEST_OPERATOR: "1"
        run: python3 citrineos_server/tests/stack_smoke.py
