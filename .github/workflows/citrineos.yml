name: CitrineOS isolated stack
on:
  pull_request:
    paths:
      - "citrineos_*/**"
      - ".github/workflows/citrineos.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: citrineos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python3 -m pip install PyYAML==6.0.2
      - run: python3 -m unittest discover -s citrineos_server/tests -p test_packaging.py -v
      - run: python3 -m unittest discover -s citrineos_server/tests -p test_v2g_readiness.py -v
      - run: node --test citrineos_server/tests/*.test.mjs
      - run: python3 -m unittest discover -s citrineos_simulator/tests -v
      - run: git diff --check
  private-stack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned images without publication
        run: |
          for app in database broker hasura server simulator; do
            docker build --build-arg BUILD_ARCH=${{ matrix.arch }} \
              -t "citrine-${app}:test" "citrineos_${app}"
          done
      - name: Authentication, discovery, persistence and logical restore
        env:
          TEST_NATIVE_SIMULATOR: "1"
        run: python3 citrineos_server/tests/stack_smoke.py
