name: CitrineOS EVerest native integration
on:
  pull_request:
    paths:
      - "citrineos_server/**"
      - "everest_v2g_simulator/**"
      - ".github/workflows/citrine-v2g-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: citrine-v2g-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-v2g:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: purcell-lab/CitrineOS-HA-Integration
          ref: b02ed937d3e2b301e99f1c8c03c2a34937c5504d
          path: citrine-client
          persist-credentials: false
      - name: Free disposable runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
      - name: Build pinned server, real V2G App and actual client (no publication)
        run: |
          for app in database broker hasura server; do
            docker build -t "citrine-${app}:test" "citrineos_${app}"
          done
          docker build --build-arg BUILD_ARCH=amd64 --build-arg BUILD_VERSION=0.1.3 \
            -t citrine-v2g:test everest_v2g_simulator
          docker build -f citrineos_server/tests/Dockerfile.client -t citrine-client:test .
      - name: Scoped HA client to CitrineOS to EVerest charge/discharge/zero/closure
        env:
          TEST_V2G_SIMULATOR: "1"
        run: python3 citrineos_server/tests/stack_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citrine-everest-v2g-evidence
          path: v2g-integration-evidence.json
          if-no-files-found: warn
