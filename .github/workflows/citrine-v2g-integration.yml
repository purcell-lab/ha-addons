name: CitrineOS EVerest native integration
on:
  pull_request:
    paths:
      - "citrineos_server/**"
      - "everest_v2g_simulator/**"
      - "everest_runtime_source/**"
      - ".github/workflows/citrine-v2g-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: citrine-v2g-${{ github.ref }}
  cancel-in-progress: true
jobs:
  requires:
    # The native trial provisions the V2G App's csms_basic_auth_password,
    # which arrives with V2G 0.1.4 (held in its own pull request until its
    # image is published). Until main's V2G App has that option, the trial
    # is skipped with a notice instead of failing. It re-enables itself.
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if grep -q '^  csms_basic_auth_password:' everest_v2g_simulator/config.yaml; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            msg="Skipped: needs the V2G App csms_basic_auth_password option (V2G 0.1.4, not yet released). main carries the released 0.1.3."
            echo "::notice::$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
  runtime:
    # The V2G App's EVerest runtime: pinned and public, or built locally
    # (everest_runtime_source/ is compiled by the job below).
    needs: requires
    if: needs.requires.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    outputs:
      build_local: ${{ steps.runtime.outputs.build_local }}
      ref: ${{ steps.runtime.outputs.ref }}
      dir: ${{ steps.runtime.outputs.dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: runtime
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh .github/scripts/everest_runtime.sh everest_v2g_simulator
  runtime-source:
    needs: runtime
    if: needs.runtime.outputs.build_local == 'true' && needs.runtime.outputs.dir == 'everest_runtime_source'
    uses: ./.github/workflows/everest-runtime-source-build.yml
    with:
      arches: '[{"runner": "ubuntu-24.04", "arch": "amd64"}]'
  native-v2g:
    needs: [requires, runtime, runtime-source]
    if: >-
      always() && needs.requires.outputs.ready == 'true' && needs.runtime.result == 'success'
      && (needs.runtime-source.result == 'success' || needs.runtime-source.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: purcell-lab/CitrineOS-HA-Integration
          ref: 2bb8fe3a3a56aaff4c3695464afa4ac316153e77
          path: citrine-client
          persist-credentials: false
      - name: Free disposable runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
      - name: Build the EVerest runtime locally (2025.10.0 extract, not yet published)
        if: needs.runtime.outputs.build_local == 'true' && needs.runtime.outputs.dir == 'everest_runtime'
        run: docker build -t everest-runtime:local everest_runtime
      - name: Fetch the EVerest runtime compiled from source
        if: needs.runtime.outputs.build_local == 'true' && needs.runtime.outputs.dir == 'everest_runtime_source'
        uses: actions/download-artifact@v4
        with:
          name: everest-runtime-source-amd64
      - name: Load the EVerest runtime compiled from source
        if: needs.runtime.outputs.build_local == 'true' && needs.runtime.outputs.dir == 'everest_runtime_source'
        run: gunzip -c everest-runtime-source.tar.gz | docker load && rm everest-runtime-source.tar.gz
      - name: Build pinned server, real V2G App and actual client (no publication)
        run: |
          for app in database broker hasura server; do
            docker build -t "citrine-${app}:test" "citrineos_${app}"
          done
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' everest_v2g_simulator/config.yaml)
          docker build --build-arg BUILD_ARCH=amd64 --build-arg BUILD_VERSION="$version" \
            --build-arg EVEREST_RUNTIME="${{ needs.runtime.outputs.ref }}" \
            -t citrine-v2g:test everest_v2g_simulator
          docker build -f citrineos_server/tests/Dockerfile.client -t citrine-client:test .
      - name: Scoped HA client to CitrineOS to EVerest charge/discharge/zero/closure
        env:
          TEST_V2G_SIMULATOR: "1"
        run: python3 citrineos_server/tests/stack_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citrine-everest-v2g-evidence
          path: v2g-integration-evidence.json
          if-no-files-found: warn
