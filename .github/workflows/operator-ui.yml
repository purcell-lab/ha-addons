name: CitrineOS Operator UI App
on:
  pull_request:
    paths:
      - ".github/green-e2e-images.yaml"
      - ".github/workflows/green-mirror.yml"
      - "citrineos_operator_ui/**"
      - ".github/workflows/operator-ui.yml"
      - ".github/workflows/operator-ui-publish.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operator-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python3 -m pip install PyYAML==6.0.2
      - run: python3 -m unittest discover -s citrineos_operator_ui/tests -p "test_*.py" -v
      - run: node --test citrineos_operator_ui/tests/proxy.test.mjs
      - run: sh -n citrineos_operator_ui/tests/ci_image_checks.sh
      - run: git diff --check
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build native image (no publication or deployment)
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' citrineos_operator_ui/config.yaml)
          docker build --build-arg BUILD_ARCH=${{ matrix.arch }} \
            --build-arg BUILD_VERSION="$version" -t operator-ui:built citrineos_operator_ui
          docker image ls operator-ui:built
      - name: Image checks (same as the publish gate)
        run: sh citrineos_operator_ui/tests/ci_image_checks.sh operator-ui:built
  published-image:
    # Merge gate: the Green follows main (green-mirror.yml) and pulls this
    # App's aarch64 image from .github/green-e2e-images.yaml, so the exact
    # version must already be publicly pullable (anonymous). On main the App
    # has no image: and other hosts build it from the Dockerfile.
    # Publish it first with the approval-gated operator-ui-publish.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prebuilt image for this version is public on GHCR
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' citrineos_operator_ui/config.yaml)
          image=$(sed -n 's/^citrineos_operator_ui: //p' .github/green-e2e-images.yaml)
          test -n "$version" && test -n "$image"
          for arch in aarch64; do
            ref="$(echo "$image" | sed "s/{arch}/$arch/"):$version"
            if docker manifest inspect "$ref" > /dev/null; then
              echo "public: $ref"
            else
              echo "::error::$ref is not publicly pullable. Publish it (operator-ui-publish.yml, version $version) and make the package public before merging."
              exit 1
            fi
          done
