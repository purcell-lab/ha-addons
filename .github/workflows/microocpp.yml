name: MicroOCPP App
on:
  pull_request:
    paths:
      - "microocpp_simulator/**"
      - ".github/workflows/microocpp.yml"
      - ".github/workflows/microocpp-publish.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: microocpp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y nginx
      - run: python3 -m unittest discover -s microocpp_simulator/tests -v
      - run: git diff --check
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build native image (no publication or deployment)
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' microocpp_simulator/config.yaml)
          docker build --build-arg BUILD_ARCH=${{ matrix.arch }} \
            --build-arg BUILD_VERSION="$version" -t microocpp:built microocpp_simulator
      - name: Image checks (same as the publish gate)
        run: sh microocpp_simulator/tests/ci_image_checks.sh microocpp:built
  published-image:
    # Merge gate: config.yaml points HA at a prebuilt image, so the exact
    # version must already be publicly pullable (anonymous, both arches).
    # Publish it first with the approval-gated microocpp-publish.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prebuilt image for this version is public on GHCR
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' microocpp_simulator/config.yaml)
          image=$(sed -n 's/^image: //p' microocpp_simulator/config.yaml)
          test -n "$version" && test -n "$image"
          for arch in amd64 aarch64; do
            ref="$(echo "$image" | sed "s/{arch}/$arch/"):$version"
            if docker manifest inspect "$ref" > /dev/null; then
              echo "public: $ref"
            else
              echo "::error::$ref is not publicly pullable. Publish it (microocpp-publish.yml, app microocpp_simulator, version $version) and make the package public before merging."
              exit 1
            fi
          done
