name: Green follows main
# The Green lab Home Assistant (aarch64, a low powered host) installs the
# CitrineOS stack and the EVerest simulators from the store entry for branch
# claude/green-e2e. Supervisor ties an installed App to its store entry, so
# moving them to main would mean a reinstall and the loss of their data.
#
# main is the build-anywhere entry: the Apps in .github/green-e2e-images.yaml
# have no image: line there, so every host builds them from the Dockerfile.
# claude/green-e2e is main plus one generated commit that gives those Apps
# their prebuilt aarch64 image and limits them to aarch64, so the Green pulls.
# Every push to main regenerates it. Never commit to claude/green-e2e
# directly; a change reaches the Green by merging to main.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: green-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Give the listed Apps their prebuilt aarch64 image
        run: |
          n=0
          while read -r app image; do
            f="$app/config.yaml"
            # main must leave the image out; a duplicate would be ambiguous.
            if grep -q '^image:' "$f"; then
              echo "::error::$f has an image: line on main"; exit 1
            fi
            IMAGE="$image" perl -0pi -e 's/^arch:\n  - aarch64\n  - amd64\n/image: $ENV{IMAGE}\narch:\n  - aarch64\n/m or die "arch block not found in $ARGV\n"' "$f"
            grep -qx "image: $image" "$f"
            echo "$app: $image (aarch64)" >> "$GITHUB_STEP_SUMMARY"
            n=$((n + 1))
          done < <(sed -n 's/^\([a-z0-9_]*\): \(ghcr\.io\/purcell-lab\/{arch}-[a-z0-9-]*\)$/\1 \2/p' .github/green-e2e-images.yaml)
          test "$n" -eq "$(grep -c '^[a-z]' .github/green-e2e-images.yaml)"
      - name: Commit and move claude/green-e2e
        run: |
          main=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "green-e2e: prebuilt aarch64 images for the Green (main $main)"
          # A generated branch: each run replaces it with main plus one commit.
          git push --force origin "HEAD:refs/heads/claude/green-e2e"
          echo "claude/green-e2e is now main $main plus the image commit" >> "$GITHUB_STEP_SUMMARY"
