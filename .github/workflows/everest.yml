name: EVerest OCPP 2.1 Test Charger App
on:
  pull_request:
    paths:
      - ".github/green-e2e-images.yaml"
      - ".github/workflows/green-mirror.yml"
      - "everest_simulator/**"
      - ".github/workflows/everest.yml"
      - ".github/scripts/everest_image_needed.sh"
      - ".github/scripts/everest_runtime.sh"
      - "everest_runtime/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: everest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    # Documentation that the image never contains (DOCS.md, VALIDATION.md,
    # RELEASE.md) does not need the 12 to 15 minute image build.
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.diff.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh .github/scripts/everest_image_needed.sh everest_simulator
  focused-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y nginx python3-yaml
      - run: python3 -m unittest discover -s everest_simulator/tests -v
      - run: git diff --check
  image:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the EVerest runtime image
        id: runtime
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh .github/scripts/everest_runtime.sh everest_simulator
      - name: Free runner disk (local runtime build pulls the 4.3 GB upstream image)
        if: steps.runtime.outputs.build_local == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /
      - name: Build the EVerest runtime locally (runtime changed or not yet published)
        if: steps.runtime.outputs.build_local == 'true'
        run: docker build -t everest-runtime:local everest_runtime
      - name: Build native image (no publication or deployment)
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' everest_simulator/config.yaml)
          docker build --build-arg BUILD_ARCH=${{ matrix.arch }} \
            --build-arg BUILD_VERSION="$version" \
            --build-arg EVEREST_RUNTIME="${{ steps.runtime.outputs.ref }}" \
            -t everest:test everest_simulator
          docker image ls everest:test
      - name: Minimum viable image checks (the publish job runs the full gate)
        env:
          CHECKS: minimal
        run: sh everest_simulator/tests/ci_image_checks.sh everest:test
  published-image:
    # Merge gate: the Green follows main (green-mirror.yml) and pulls this
    # App's aarch64 image from .github/green-e2e-images.yaml, so the exact
    # version must already be publicly pullable (anonymous). On main the App
    # has no image: and other hosts build it from the Dockerfile.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: EVerest runtime is pinned by digest and public on GHCR
        run: |
          ref=$(sed -n 's/^ARG EVEREST_RUNTIME=//p' everest_simulator/Dockerfile)
          if ! echo "$ref" | grep -q '@sha256:[0-9a-f]\{64\}$'; then
            echo "::error::everest_simulator/Dockerfile ARG EVEREST_RUNTIME=$ref is not pinned by digest. Publish the runtime (approval-gated tag everest_runtime-v<version>) and pin its digest before merging."; exit 1
          fi
          docker manifest inspect "$ref" > /dev/null || {
            echo "::error::$ref is not publicly pullable."; exit 1; }
          echo "public: $ref"
      - name: Prebuilt image for this version is public on GHCR
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' everest_simulator/config.yaml)
          image=$(sed -n 's/^everest_simulator: //p' .github/green-e2e-images.yaml)
          test -n "$version" && test -n "$image"
          for arch in aarch64; do
            ref="$(echo "$image" | sed "s/{arch}/$arch/"):$version"
            if docker manifest inspect "$ref" > /dev/null; then
              echo "public: $ref"
            else
              echo "::error::$ref is not publicly pullable. Publish it (approval-gated tag everest_simulator-v$version) and make the package public before merging."
              exit 1
            fi
          done
