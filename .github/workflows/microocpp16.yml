name: MicroOCPP 1.6 Smart Charging App
on:
  pull_request:
    paths:
      - "microocpp_simulator16/**"
      - ".github/workflows/microocpp16.yml"
      - ".github/workflows/microocpp-publish.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: microocpp16-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y nginx
      - run: python3 -m unittest discover -s microocpp_simulator16/tests -v
      - run: git diff --check
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build native image (no publication or deployment)
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' microocpp_simulator16/config.yaml)
          docker build --build-arg BUILD_ARCH=${{ matrix.arch }} \
            --build-arg BUILD_VERSION="$version" -t microocpp16:built microocpp_simulator16
      - name: Image checks (same as the publish gate)
        run: sh microocpp_simulator16/tests/ci_image_checks.sh microocpp16:built
      - name: Status-page browser checks (synthetic data only)
        if: matrix.arch == 'amd64'
        run: |
          docker create --name ui-extract microocpp16:test
          docker cp ui-extract:/opt/microocpp/public/bundle.html /tmp/txprofile-bundle.html
          docker rm ui-extract
          npm install --no-save --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
          node microocpp_simulator16/tests/txprofile_ui.cjs /tmp/txprofile-bundle.html
  published-image:
    # Merge gate: config.yaml points HA at a prebuilt image, so the exact
    # version must already be publicly pullable (anonymous, both arches).
    # Publish it first with the approval-gated microocpp-publish.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prebuilt image for this version is public on GHCR
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' microocpp_simulator16/config.yaml)
          image=$(sed -n 's/^image: //p' microocpp_simulator16/config.yaml)
          test -n "$version" && test -n "$image"
          for arch in amd64 aarch64; do
            ref="$(echo "$image" | sed "s/{arch}/$arch/"):$version"
            if docker manifest inspect "$ref" > /dev/null; then
              echo "public: $ref"
            else
              echo "::error::$ref is not publicly pullable. Publish it (microocpp-publish.yml, app microocpp_simulator16, version $version) and make the package public before merging."
              exit 1
            fi
          done
