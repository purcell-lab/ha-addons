name: Publish EVerest runtime image (built from source)
# Publication is an explicit operator action, started one of two ways:
# - a maintainer pushes a tag everest_runtime_source-v<version> matching
#   everest_runtime_source/VERSION, or
# - a maintainer runs this workflow manually (workflow_dispatch) with the
#   version and the commit to publish. That run publishes the image and then
#   creates the annotated tag on the exact commit it built, because a tag made
#   with the workflow token would not start this workflow again.
# Pull requests and branch pushes never publish (they build the same image in
# everest-v2g.yml and keep it in the run only).
# Each architecture is compiled natively (everest-runtime-source-build.yml),
# pushed as <version>-<arch>, then one multi-arch index <version> is created
# with a provenance attestation. Nothing is overwritten and no tag is moved.
on:
  push:
    tags:
      - "everest_runtime_source-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Runtime version without a leading v, e.g. 2026.10.0-rc1-1. Must match everest_runtime_source/VERSION at the target."
        required: true
        type: string
      target:
        description: "Commit sha (preferred) or branch to publish, e.g. the reviewed PR head."
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: everest-runtime-source-publish-${{ inputs.version || github.ref }}
  cancel-in-progress: false
env:
  REPO: ghcr.io/purcell-lab/everest-runtime
jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target || github.ref }}
      - name: Tag or requested version must match everest_runtime_source/VERSION
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.version }}
        run: |
          version=$(cat everest_runtime_source/VERSION)
          tag="everest_runtime_source-v$version"
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "$REQUESTED" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.-]*$' || {
              echo "::error::version '$REQUESTED' is not a plain version string"; exit 1; }
            test "$REQUESTED" = "$version" || {
              echo "::error::requested $REQUESTED but everest_runtime_source/VERSION at the target says $version"; exit 1; }
            # Never move a tag: a dispatch publishes only an untagged version.
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::tag $tag already exists; this workflow never moves a tag"; exit 1
            fi
          else
            test "$GITHUB_REF_NAME" = "$tag" || {
              echo "::error::tag $GITHUB_REF_NAME does not match everest_runtime_source/VERSION $version"; exit 1; }
          fi
          sha=$(git rev-parse HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $version from $sha ($EVENT)" >> "$GITHUB_STEP_SUMMARY"
      - name: Refuse to overwrite a published version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for ref in "$REPO:$VERSION" "$REPO:$VERSION-amd64" "$REPO:$VERSION-aarch64"; do
            if docker manifest inspect "$ref" > /dev/null 2>&1; then
              echo "::error::$ref already exists. Bump everest_runtime_source/VERSION instead."; exit 1
            fi
          done
  build:
    needs: check
    uses: ./.github/workflows/everest-runtime-source-build.yml
    with:
      ref: ${{ needs.check.outputs.sha }}
  push:
    needs: [check, build]
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, aarch64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: everest-runtime-source-${{ matrix.arch }}
      - name: Log in to GHCR (job token, this repository's packages only)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push (architecture tag only)
        run: |
          gunzip -c everest-runtime-source.tar.gz | docker load
          if docker manifest inspect "$REPO:$VERSION-${{ matrix.arch }}" > /dev/null 2>&1; then
            echo "::error::$REPO:$VERSION-${{ matrix.arch }} appeared during the run"; exit 1
          fi
          docker tag everest-runtime:local "$REPO:$VERSION-${{ matrix.arch }}"
          docker push "$REPO:$VERSION-${{ matrix.arch }}"
  index:
    needs: [check, push]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Log in to GHCR (job token, this repository's packages only)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Create the multi-arch index
        id: index
        run: |
          docker buildx imagetools create -t "$REPO:$VERSION" "$REPO:$VERSION-amd64" "$REPO:$VERSION-aarch64"
          digest=$(docker buildx imagetools inspect "$REPO:$VERSION" --format '{{json .Manifest}}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["digest"])')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "Published $REPO:$VERSION@$digest"
            echo
            echo "Pin it in everest_v2g_simulator/Dockerfile:"
            echo
            echo "    ARG EVEREST_RUNTIME=$REPO:$VERSION@$digest"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REPO }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
  tag:
    # Manual runs only: tag the exact commit the check job resolved, after the
    # index is pushed and attested. A tag push already has its tag.
    # If only this job fails, use "Re-run failed jobs": a full re-run would
    # stop at "Refuse to overwrite a published version".
    needs: [check, index]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - name: Create the annotated release tag on the published commit
        env:
          SHA: ${{ needs.check.outputs.sha }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::tag $TAG appeared during the run; not moving it"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "EVerest runtime ${TAG#everest_runtime_source-v} (built from source)" "$SHA"
          git push origin "refs/tags/$TAG"
          echo "Tagged $TAG at $SHA" >> "$GITHUB_STEP_SUMMARY"
