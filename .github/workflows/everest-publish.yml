name: Publish EVerest App image
# Publication is an explicit operator action: it runs only when a maintainer
# pushes a tag everest_simulator-v<version> matching config.yaml. Pull
# requests and branch pushes never publish.
on:
  push:
    tags:
      - "everest_simulator-v*"
permissions:
  contents: read
concurrency:
  group: everest-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    strategy:
      fail-fast: true
      matrix:
        # amd64 only: the target HA host is generic-x86-64. To support
        # aarch64 again, add runner ubuntu-24.04-arm / arch aarch64 here and
        # in the other EVerest workflows, and to config.yaml arch.
        include:
          - runner: ubuntu-24.04
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the App version
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' everest_simulator/config.yaml)
          image=$(sed -n 's/^image: //p' everest_simulator/config.yaml)
          test "$GITHUB_REF_NAME" = "everest_simulator-v$version" || {
            echo "::error::tag $GITHUB_REF_NAME does not match config.yaml version $version"; exit 1; }
          test "$image" = "ghcr.io/purcell-lab/{arch}-everest-simulator"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/purcell-lab/${{ matrix.arch }}-everest-simulator" >> "$GITHUB_ENV"
      - name: Log in to GHCR (job token, this repository's packages only)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Refuse to overwrite a published version
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists. Bump the App version instead."; exit 1
          fi
      - name: EVerest runtime must be pinned by digest and public
        # Releases build only from the published runtime image, never a
        # local extract, so the shipped files match the identical-file check.
        run: |
          ref=$(sed -n 's/^ARG EVEREST_RUNTIME=//p' everest_simulator/Dockerfile)
          echo "$ref" | grep -q '@sha256:[0-9a-f]\{64\}$' || {
            echo "::error::ARG EVEREST_RUNTIME=$ref is not pinned by digest"; exit 1; }
          docker manifest inspect "$ref" > /dev/null
          echo "EVerest runtime: $ref" >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: |
          docker build --build-arg BUILD_ARCH=${{ matrix.arch }} --build-arg BUILD_VERSION="$VERSION" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$IMAGE:$VERSION" everest_simulator
          docker image ls "$IMAGE"
      - name: Release gate (same checks as PR CI)
        run: sh everest_simulator/tests/ci_image_checks.sh "$IMAGE:$VERSION"
      - name: Push (version tag only, no latest)
        id: push
        run: |
          docker push "$IMAGE:$VERSION"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE:$VERSION@$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
