name: EVerest DC V2G Test Charger App
on:
  pull_request:
    paths:
      - ".github/green-e2e-images.yaml"
      - ".github/workflows/green-mirror.yml"
      - "everest_v2g_simulator/**"
      - ".github/workflows/everest-v2g.yml"
      - ".github/workflows/everest-v2g-publish.yml"
      - ".github/scripts/everest_image_needed.sh"
      - ".github/scripts/everest_runtime.sh"
      - ".github/scripts/everest_runtime_source.sh"
      - ".github/workflows/everest-runtime-source-build.yml"
      - "everest_runtime/**"
      - "everest_runtime_source/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: everest-v2g-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    # Documentation that the image never contains (DOCS.md, VALIDATION.md,
    # RELEASE.md) needs no image. A change to only the Status page, changelog
    # or version runs the ui image checks (about a minute) instead of the
    # charging sessions (about 8 minutes); see everest_image_needed.sh.
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.diff.outputs.images }}
      checks: ${{ steps.diff.outputs.checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh .github/scripts/everest_image_needed.sh everest_v2g_simulator
  focused-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y nginx openssl python3-yaml
      - run: python3 -m unittest discover -s everest_v2g_simulator/tests -v
      - run: |
          for script in everest_runtime.sh everest_runtime_source.sh everest_identical_files.sh; do
            sh -n ".github/scripts/$script"
          done
      - run: git diff --check
  runtime:
    # Which EVerest runtime the App image builds from: the pinned public one,
    # or a local build from everest_runtime/ (upstream image extract) or
    # everest_runtime_source/ (compiled from source, below).
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04
    outputs:
      build_local: ${{ steps.runtime.outputs.build_local }}
      ref: ${{ steps.runtime.outputs.ref }}
      dir: ${{ steps.runtime.outputs.dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the EVerest runtime image
        id: runtime
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh .github/scripts/everest_runtime.sh everest_v2g_simulator
  runtime-source:
    # Compile EVerest once per architecture when the runtime is the
    # from-source one and is not published yet (or this PR changes it).
    needs: runtime
    if: needs.runtime.outputs.build_local == 'true' && needs.runtime.outputs.dir == 'everest_runtime_source'
    uses: ./.github/workflows/everest-runtime-source-build.yml
  image:
    needs: [changes, runtime, runtime-source]
    if: >-
      always() && needs.changes.outputs.images == 'true' && needs.runtime.result == 'success'
      && (needs.runtime-source.result == 'success' || needs.runtime-source.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      IMAGE: everest-v2g:built
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free runner disk (local runtime build pulls the 4.3 GB upstream image)
        if: needs.runtime.outputs.build_local == 'true' && needs.runtime.outputs.dir == 'everest_runtime'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /
      - name: Build the EVerest runtime locally (runtime changed or not yet published)
        if: needs.runtime.outputs.build_local == 'true' && needs.runtime.outputs.dir == 'everest_runtime'
        run: docker build -t everest-runtime:local everest_runtime
      - name: Fetch the EVerest runtime compiled from source (runtime-source job)
        if: needs.runtime.outputs.build_local == 'true' && needs.runtime.outputs.dir == 'everest_runtime_source'
        uses: actions/download-artifact@v4
        with:
          name: everest-runtime-source-${{ matrix.arch }}
      - name: Load the EVerest runtime compiled from source
        if: needs.runtime.outputs.build_local == 'true' && needs.runtime.outputs.dir == 'everest_runtime_source'
        run: gunzip -c everest-runtime-source.tar.gz | docker load && rm everest-runtime-source.tar.gz
      - name: Build native image (no publication or deployment)
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' everest_v2g_simulator/config.yaml)
          docker build --build-arg BUILD_ARCH=${{ matrix.arch }} \
            --build-arg BUILD_VERSION="$version" \
            --build-arg EVEREST_RUNTIME="${{ needs.runtime.outputs.ref }}" \
            -t "$IMAGE" everest_v2g_simulator
          docker image ls "$IMAGE"
      - name: Image checks, ${{ needs.changes.outputs.checks }} (the publish job runs the full gate)
        env:
          CHECKS: ${{ needs.changes.outputs.checks == 'ui' && 'ui' || 'minimal' }}
        run: sh everest_v2g_simulator/tests/ci_image_checks.sh "$IMAGE"
  published-image:
    # Merge gate: the Green follows main (green-mirror.yml) and pulls this
    # App's aarch64 image from .github/green-e2e-images.yaml, so the exact
    # version must already be publicly pullable (anonymous). On main the App
    # has no image: and other hosts build it from the Dockerfile.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: EVerest runtime is pinned by digest and public on GHCR
        run: |
          ref=$(sed -n 's/^ARG EVEREST_RUNTIME=//p' everest_v2g_simulator/Dockerfile)
          if ! echo "$ref" | grep -q '@sha256:[0-9a-f]\{64\}$'; then
            echo "::error::everest_v2g_simulator/Dockerfile ARG EVEREST_RUNTIME=$ref is not pinned by digest. Publish the runtime (approval-gated tag everest_runtime-v<version>) and pin its digest before merging."; exit 1
          fi
          docker manifest inspect "$ref" > /dev/null || {
            echo "::error::$ref is not publicly pullable."; exit 1; }
          echo "public: $ref"
      - name: Prebuilt image for this version is public on GHCR
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' everest_v2g_simulator/config.yaml)
          image=$(sed -n 's/^everest_v2g_simulator: //p' .github/green-e2e-images.yaml)
          test -n "$version" && test -n "$image"
          for arch in aarch64; do
            ref="$(echo "$image" | sed "s/{arch}/$arch/"):$version"
            if docker manifest inspect "$ref" > /dev/null; then
              echo "public: $ref"
            else
              echo "::error::$ref is not publicly pullable. Publish it (approval-gated tag everest_v2g_simulator-v$version) and make the package public before merging."
              exit 1
            fi
          done
