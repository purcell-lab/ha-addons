name: EVerest DC V2G Test Charger App
on:
  pull_request:
    paths:
      - "everest_v2g_simulator/**"
      - ".github/workflows/everest-v2g.yml"
      - ".github/workflows/everest-v2g-publish.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: everest-v2g-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y nginx openssl python3-yaml
      - run: python3 -m unittest discover -s everest_v2g_simulator/tests -v
      - run: git diff --check
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      IMAGE: everest-v2g:built
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (upstream build image is about 4.3 GB compressed)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /
      - name: Build native image (no publication or deployment)
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' everest_v2g_simulator/config.yaml)
          docker build --build-arg BUILD_ARCH=${{ matrix.arch }} \
            --build-arg BUILD_VERSION="$version" -t "$IMAGE" everest_v2g_simulator
          docker image ls "$IMAGE"
      - name: Image release gate (same script as the publish job)
        run: sh everest_v2g_simulator/tests/ci_image_checks.sh "$IMAGE"
  published-image:
    # Merge gate: config.yaml points HA at a prebuilt image, so the exact
    # version must already be publicly pullable (anonymous, both arches).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prebuilt image for this version is public on GHCR
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' everest_v2g_simulator/config.yaml)
          image=$(sed -n 's/^image: //p' everest_v2g_simulator/config.yaml)
          test -n "$version" && test -n "$image"
          for arch in amd64 aarch64; do
            ref="$(echo "$image" | sed "s/{arch}/$arch/"):$version"
            if docker manifest inspect "$ref" > /dev/null; then
              echo "public: $ref"
            else
              echo "::error::$ref is not publicly pullable. Publish it (approval-gated tag everest_v2g_simulator-v$version) and make the package public before merging."
              exit 1
            fi
          done
