name: Publish CitrineOS Isolated Lab App image
# Builds the CitrineOS Isolated Lab App (CitrineOS from source) in GitHub
# Actions so Home Assistant pulls a prebuilt image instead of compiling on
# the host (a TypeScript monorepo build). Publication is an
# explicit operator action, started one of two ways:
# - a maintainer pushes a tag citrineos_server-v<version> matching
#   citrineos_server/config.yaml, or
# - a maintainer runs this workflow manually (workflow_dispatch) with the
#   version and commit to publish. That run publishes the images and then
#   creates the annotated tag on the exact commit it built, because a tag made
#   with the workflow token would not start this workflow again.
# Pull requests and branch pushes never publish. No run overwrites an image or
# moves an existing tag.
on:
  push:
    tags:
      - "citrineos_server-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "App version without a leading v. Must match citrineos_server/config.yaml at the target."
        required: true
        type: string
      target:
        description: "Commit sha (preferred) or branch to publish, e.g. the reviewed PR head."
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: citrineos-server-publish-${{ inputs.version || github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target || github.ref }}
      - name: Tag or requested version must match the App version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.version }}
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' citrineos_server/config.yaml)
          image=$(sed -n 's/^image: //p' citrineos_server/config.yaml)
          tag="citrineos_server-v$version"
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "$REQUESTED" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
              echo "::error::version '$REQUESTED' is not X.Y.Z"; exit 1; }
            test "$REQUESTED" = "$version" || {
              echo "::error::requested $REQUESTED but config.yaml at the target says $version"; exit 1; }
            # Never move a tag: a dispatch publishes only an untagged version.
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::tag $tag already exists; this workflow never moves a tag"; exit 1
            fi
          else
            test "$GITHUB_REF_NAME" = "$tag" || {
              echo "::error::tag $GITHUB_REF_NAME does not match config.yaml version $version"; exit 1; }
          fi
          test "$image" = "ghcr.io/purcell-lab/{arch}-citrineos-server"
          sha=$(git rev-parse HEAD)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$sha" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/purcell-lab/${{ matrix.arch }}-citrineos-server" >> "$GITHUB_ENV"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $version from $sha ($EVENT)" >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to GHCR (job token, this repository's packages only)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Refuse to overwrite a published version
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists. Bump the App version instead."; exit 1
          fi
      - name: Build
        run: |
          docker build --build-arg BUILD_ARCH=${{ matrix.arch }} \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$SOURCE_SHA" \
            -t "$IMAGE:$VERSION" citrineos_server
          docker image ls "$IMAGE"
      - name: Release gate (same checks as PR CI)
        run: sh citrineos_server/tests/ci_image_checks.sh "$IMAGE:$VERSION"
      - name: Push (version tag only, no latest)
        id: push
        run: |
          docker push "$IMAGE:$VERSION"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE:$VERSION@$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
  tag:
    # Manual runs only: tag the exact commit the publish job built, after both
    # images are pushed and attested. A tag push already has its tag.
    # If only this job fails, use "Re-run failed jobs": a full re-run would
    # stop at "Refuse to overwrite a published version".
    needs: publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.sha }}
      - name: Create the annotated release tag on the published commit
        env:
          SHA: ${{ needs.publish.outputs.sha }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::tag $TAG appeared during the run; not moving it"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "CitrineOS Isolated Lab App ${TAG#citrineos_server-v}" "$SHA"
          git push origin "refs/tags/$TAG"
          echo "Tagged $TAG at $SHA" >> "$GITHUB_STEP_SUMMARY"
