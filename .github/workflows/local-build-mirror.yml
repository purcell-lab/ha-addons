name: local-build follows main
# Prebuilt images for the CitrineOS stack and the EVerest simulators are
# published for aarch64 only (low powered hosts such as the Green). An App
# whose config.yaml names an image is always pulled, on every architecture,
# so amd64 hosts use a separate store entry instead:
#   https://github.com/purcell-lab/ha-addons#local-build
# That branch is generated from main on every push: the same files, except
# that these Apps drop their image: line (Supervisor then builds them from the
# Dockerfile on the host) and list amd64 again. Never commit to local-build
# directly; a change reaches it by merging to main.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: local-build-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      APPS: citrineos_server citrineos_operator_ui everest_simulator everest_v2g_simulator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Turn the published Apps into local builds
        run: |
          for app in $APPS; do
            f="$app/config.yaml"
            grep -q '^image: ghcr.io/purcell-lab/{arch}-' "$f"
            sed -i '/^image: /d' "$f"
            # Exactly "arch:" followed by "  - aarch64" is expected on main.
            perl -0pi -e 's/^arch:\n  - aarch64\n(?!  - )/arch:\n  - aarch64\n  - amd64\n/m or die "arch block not found in $ARGV\n"' "$f"
            ! grep -q '^image:' "$f"
            grep -A2 '^arch:' "$f" | grep -qx '  - amd64'
          done
          sed -i 's/^name: "\(.*\)"$/name: "\1 (local build)"/' repository.yaml
          grep -q '(local build)' repository.yaml
      - name: Commit and move local-build
        run: |
          main=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "local-build: build the published Apps on the host (main $main)"
          # A generated branch: each run replaces it with main plus one commit.
          git push --force origin "HEAD:refs/heads/local-build"
          echo "local-build is now main $main plus the local-build commit" >> "$GITHUB_STEP_SUMMARY"
